name: WallaFans - Watchdog

# Alerts to Telegram if polling has been silent for too long
# (e.g. expired refresh token, API blocked).
on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet requests

      - name: Check staleness
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m wallafans.cli watchdog --max-age 90
        continue-on-error: true