name: Walla Sentry - Poll

# Runs every 30 minutes + manual trigger.
# NOTE: intentionally NO `push:` trigger, to avoid loops when the bot commits state.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: wallasentry-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet requests

      - name: Run poll cycle
        env:
          WALLAFANS_REFRESH_TOKEN: ${{ secrets.WALLAFANS_REFRESH_TOKEN }}
          WALLAFANS_REFRESH_CLIENT_ID: ${{ secrets.WALLAFANS_REFRESH_CLIENT_ID }}
          WALLAFANS_SESSION_COOKIE: ${{ secrets.WALLAFANS_SESSION_COOKIE }}
          WALLAFANS_EMAIL: ${{ secrets.WALLAFANS_EMAIL }}
          WALLAFANS_PASSWORD: ${{ secrets.WALLAFANS_PASSWORD }}
          WALLAFANS_USER_ID: ${{ secrets.WALLAFANS_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBNUB_SUBSCRIBE_KEY: ${{ secrets.PUBNUB_SUBSCRIBE_KEY }}
          PUBNUB_PUBLISH_KEY: ${{ secrets.PUBNUB_PUBLISH_KEY }}
          PUBNUB_AUTH_TOKEN: ${{ secrets.PUBNUB_AUTH_TOKEN }}
          PUBNUB_CHANNEL: ${{ secrets.PUBNUB_CHANNEL }}
          PUBNUB_LAST_TIMETOKEN: ${{ secrets.PUBNUB_LAST_TIMETOKEN }}
        run: python -m wallasentry.cli poll

      - name: Commit state back
        run: |
          git config user.name "wallasentry-bot"
          git config user.email "actions@github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add state/
          if git diff --cached --quiet; then
            echo "no state changes"
          else
            git commit -m "chore(state): poll $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD
          fi